<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Quest to Publish</title>
  <!-- Styles and art are inline because this page can be shown at any web address. -->
  <style>
    body {
      box-sizing: border-box;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      background:
        repeating-radial-gradient(ellipse 110% 90% at 50% 50%, transparent 0 54px, rgba(160, 208, 210, 0.1) 54px 56px),
        #0c2530;
      color: #f6eedb;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: clamp(1.0625rem, 0.7rem + 0.7vw, 1.6rem);
      line-height: 1.65;
      text-align: center;
    }
    main {
      max-width: 34em;
      padding: 2em 1.5em;
      border: 2px solid #356273;
      border-radius: 0.8em;
      background: #143a49;
      box-shadow: 8px 8px 0 #04141b;
    }
    svg { width: 7em; height: 7em; }
    h1 {
      margin: 0.4em 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      line-height: 1.2;
    }
    .kicker {
      margin: 0;
      color: #ff9670;
      font-size: 0.8em;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    a {
      display: inline-block;
      padding: 0.6em 1.3em;
      border: 2px solid #10202a;
      border-radius: 0.5em;
      background: #ff8f66;
      box-shadow: 4px 4px 0 #04141b;
      color: #10202a;
      font-weight: 750;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    :focus-visible {
      outline: 3px solid #ffe08a;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">
      <circle cx="60" cy="60" r="54" fill="#0f2e3b" stroke="#87adb6" stroke-width="4"/>
      <path d="M60 12v10M60 98v10M12 60h10M98 60h10" stroke="#87adb6" stroke-width="3" stroke-linecap="round"/>
      <g transform="rotate(137 60 60)">
        <path d="M60 22 71 60H49Z" fill="#ff8f66"/>
        <path d="M60 98 49 60h22Z" fill="#f6eedb"/>
      </g>
      <circle cx="60" cy="60" r="5" fill="#0f2e3b" stroke="#87adb6" stroke-width="3"/>
    </svg>
    <p class="kicker">Error 404</p>
    <h1>Off the map</h1>
    <p>This link leads nowhere. If you were hunting bugs, you may have just found one. Use your browser's Back button to return.</p>
    <p><a id="home-link" href="/">Go to the expedition map</a></p>
  </main>
  <script>
    // GitHub Pages serves this site from a folder named after the repository.
    if (/\.github\.io$/.test(window.location.hostname)) {
      var folder = window.location.pathname.split("/")[1];
      document.getElementById("home-link").href = "/" + folder + "/";
    }
  </script>
</body>
</html>
